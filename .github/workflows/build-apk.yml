name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install, test, build web app
        run: |
          npm ci
          npm test
          npm run build

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/add-widgets.mjs
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle

      - name: Use the repo's signing key so updates install over older builds
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TradingApp-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TradingApp-apk
          path: TradingApp-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" TradingApp-*.apk \
            --title "TradingApp 0.1.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Download the .apk below on your Android phone and open it to install."
